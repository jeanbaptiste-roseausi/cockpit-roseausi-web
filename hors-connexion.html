<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cockpit RoseauSI, hors connexion</title>
<meta name="theme-color" content="#008078">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<!-- Servie par le service worker quand le réseau manque à l'ouverture du cockpit. Autonome : aucun script ni
     style externe, pour s'afficher sans réseau. Revient seule au cockpit dès que le réseau est là. -->
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --card: #f2f7f6; --ink: #1a1a1a; --muted: #5f5f5f; --teal: #008078; --on-teal: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1615; --card: #132422; --ink: #e8efee; --muted: #a9b8b6; --teal: #3fbfb4; --on-teal: #062320; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 Arial, Helvetica, sans-serif; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { width: min(420px, 100%); background: var(--card); border-radius: 16px; padding: 28px 24px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font: 600 22px/1.2 'Fredoka', Arial, sans-serif; color: var(--teal); margin: 14px 0 8px; }
  p { margin: 0 0 18px; color: var(--muted); }
  button { appearance: none; border: 0; border-radius: 24px; background: var(--teal); color: var(--on-teal); font: inherit; font-weight: 700; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="" width="64" height="64">
  <h1>Hors connexion</h1>
  <p>Le cockpit revient dès que le réseau est là.</p>
  <button type="button" id="re">Réessayer</button>
</main>
<script>
  // La page affichée garde l'adresse demandée (#/todo/…) : on la recharge telle quelle.
  const revenir = () => location.reload();
  document.getElementById("re").addEventListener("click", revenir);
  window.addEventListener("online", revenir);
  // Certains appareils ne préviennent pas du retour du réseau : on essaie toutes les 5 secondes, page visible.
  setInterval(() => {
    if (document.visibilityState === "visible") fetch("version.txt", { cache: "no-store" }).then(revenir, () => {});
  }, 5000);
</script>
</body>
</html>
