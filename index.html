<div id="app" class="app"><p class="muted" style="padding:24px">Chargement…</p></div>

<aside id="drawer" aria-label="Fiche" tabindex="-1">
  <div class="dr-top">
    <button class="iconbtn" data-act="back" id="dr-back" aria-label="Fiche précédente" hidden><svg class="ic"><use href="#i-back"/></svg></button>
    <span class="kind" id="dr-kind">Contact</span>
    <div id="dr-seg" role="group" aria-label="Aller à"><button data-act="drfiche">Fiche</button><button data-act="drside">Agent</button></div>
    <a class="btn sm ghost" id="dr-notion" target="_blank" rel="noopener" hidden><svg class="ic ic-sm"><use href="#i-ext"/></svg>Notion</a>
    <button class="iconbtn" data-act="close" aria-label="Fermer la fiche"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div class="dr-main" id="dr-main"><div class="dr-body" id="dr-body"></div><aside class="dr-side" id="dr-side" aria-label="Mes notes et agent de la fiche"></aside></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
